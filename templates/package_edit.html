{% extends 'base.html' %}{% block content %}<section class="panel-card"><span class="eyebrow">EDITAR PACOTE</span><h1>{{ package.public_id }}</h1><form method="post" id="package-form" class="{{ 'has-errors' if form_data.has_error else '' }}"><label>Buscar cliente<input id="package-client-search" type="search" autocomplete="off" placeholder="Nome, ID ou telefone"></label><div id="package-client-results" class="results client-search-results"></div><label>Cliente selecionado<input name="client_label" id="client-label" value="{{ form_data.client_label or (package.client_name+' · '+package.client_public_id) }}" readonly required></label><input type="hidden" name="client_id" id="client-id" value="{{ form_data.client_id or package.client_id }}"><div class="three"><label>Rastreio<input name="tracking" required pattern="[A-Za-z0-9]+" value="{{ form_data.tracking }}"></label><label>Prateleira<input name="shelf" required pattern="[A-Za-z0-9]+" value="{{ form_data.shelf }}"></label><label>Peso (kg)<input name="weight" required inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" value="{{ form_data.weight }}"></label></div><div class="three"><label>Largura (cm)<input name="width" required inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" value="{{ form_data.width }}"></label><label>Altura (cm)<input name="height" required inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" value="{{ form_data.height }}"></label><label>Comprimento (cm)<input name="length" required inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" value="{{ form_data.length }}"></label></div><button class="button primary">Salvar alterações</button></form><a class="button ghost" href="{{ url_for('package_detail',package_id=package.id) }}">Cancelar</a></section>{% endblock %}
