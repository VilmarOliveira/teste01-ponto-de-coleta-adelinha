{% extends 'base.html' %}{% block content %}<section class="login-card"><span class="eyebrow">SENHA DO CLIENTE</span>{% if invalid %}<h1>Link inválido</h1><p>Este link expirou ou já foi utilizado. Procure a equipe para conferir sua identidade e gerar outro.</p>{% else %}<h1>Defina sua senha</h1><p>Use ao menos 8 caracteres.</p><form method="post"><label>Nova senha<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar senha<input name="password_confirm" type="password" minlength="8" required autocomplete="new-password"></label><button class="button primary full">Salvar senha</button></form>{% endif %}</section>{% endblock %}
